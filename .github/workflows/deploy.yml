name: Deploy Baromontres

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      # pnpm 11 to match the lockfile: `overrides` and build-script approvals
      # (allowBuilds) live in pnpm-workspace.yaml, which only pnpm >= 10.4 reads.
      # pnpm 9 ignored them and frozen install failed with a lockfile-config mismatch.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Apex hub (tick-ticker.com). The custom domain is bound to this worker in
      # the Cloudflare dashboard; deploying updates the version it serves.
      - name: Deploy apex hub
        run: pnpm deploy:hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Barometer worker — private, served only via app.tick-ticker.com behind
      # Cloudflare Access (workers_dev disabled). Deploy updates the version.
      - name: Deploy barometer worker
        run: pnpm deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy cron worker
        run: pnpm deploy:cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -e
          # Apex hub is live and indexable.
          curl -sf https://tick-ticker.com/ > /dev/null
          # Retired barometer API returns 410 Gone at the apex.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://tick-ticker.com/api/health)
          if [ "$code" != "410" ]; then
            echo "Expected 410 at apex /api/health, got $code"; exit 1
          fi
          # Cron worker is healthy. (The barometer itself is behind Access and
          # cannot be smoke-tested without a service token.)
          curl -sf https://baromontres-cron.onepau.workers.dev/ > /dev/null
