<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tick ticker — Baromètre de la presse horlogère francophone</title>
    <meta
      name="description"
      content="Baromètre de prix et d'humeur des articles de businessmontres.com"
    />

    <link rel="canonical" href="https://tick-ticker.com/" />
    <link rel="alternate" hreflang="fr" href="https://tick-ticker.com/" />
    <link rel="alternate" hreflang="en" href="https://tick-ticker.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://tick-ticker.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tick ticker" />
    <meta property="og:title" content="Tick ticker — Baromètre de la presse horlogère francophone" />
    <meta property="og:description" content="Baromètre de prix et d'humeur des articles de businessmontres.com" />
    <meta property="og:url" content="https://tick-ticker.com/" />
    <meta property="og:image" content="https://tick-ticker.com/og.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tick ticker — Baromètre de la presse horlogère francophone" />
    <meta name="twitter:description" content="Baromètre de prix et d'humeur des articles de businessmontres.com" />
    <meta name="twitter:image" content="https://tick-ticker.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Tick ticker — Baromètre des prix de la presse horlogère francophone",
        "description": "Baromètre de prix et d'humeur des articles de la presse horlogère francophone, mis à jour quotidiennement à partir de businessmontres.com.",
        "url": "https://tick-ticker.com/",
        "inLanguage": "fr",
        "keywords": ["montres", "presse horlogère", "businessmontres.com", "prix", "analyse de sentiment", "baromètre"],
        "isAccessibleForFree": true,
        "creator": { "@type": "Organization", "name": "Tick ticker", "url": "https://tick-ticker.com" },
        "distribution": [{
          "@type": "DataDownload",
          "encodingFormat": "application/json",
          "contentUrl": "https://tick-ticker.com/api/barometer"
        }]
      }
    </script>

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <h1>Tick ticker</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <nav class="lang-switch" aria-label="Language">
        <button data-lang="fr" aria-pressed="true">FR</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </nav>
    </header>

    <main>
      <section class="intro" aria-label="about">
        <h2 data-i18n="introTitle"></h2>
        <p data-i18n="introBody"></p>
      </section>

      <section class="chart-section">
        <div class="chart-meta">
          <div>
            <span class="meta-label" data-i18n="period"></span>
            <strong id="meta-period">…</strong>
          </div>
          <div>
            <span class="meta-label" data-i18n="averagePrice"></span>
            <strong id="meta-average">…</strong>
          </div>
          <div>
            <span class="meta-label" data-i18n="articleCount"></span>
            <strong id="meta-count">…</strong>
          </div>
          <div>
            <span class="meta-label" data-i18n="subscription"></span>
            <strong id="meta-subscription">—</strong>
          </div>
        </div>
        <nav class="range-filter" aria-label="date range">
          <button data-range="1m" type="button" aria-pressed="false">1M</button>
          <button data-range="3m" type="button" aria-pressed="false">3M</button>
          <button data-range="6m" type="button" aria-pressed="false">6M</button>
          <button data-range="1y" type="button" aria-pressed="false">1Y</button>
          <button data-range="all" type="button" aria-pressed="true" data-i18n="rangeAll"></button>
        </nav>
        <div class="chart-wrap">
          <canvas id="barometer" width="1024" height="420" aria-label="price barometer"></canvas>
          <button
            id="reset-zoom"
            class="reset-zoom"
            type="button"
            data-i18n="resetZoom"
            hidden
          ></button>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
        <ul class="legend" aria-label="sentiment legend">
          <li><span class="dot dot-positive"></span><span data-i18n="positive"></span></li>
          <li><span class="dot dot-neutral"></span><span data-i18n="neutral"></span></li>
          <li><span class="dot dot-negative"></span><span data-i18n="negative"></span></li>
          <li><span class="dot dot-unknown"></span><span data-i18n="unknown"></span></li>
          <li><span class="dash dash-trend"></span><span data-i18n="trendMonthlyAverage"></span></li>
        </ul>
      </section>

      <!--
        Google AdSense placeholder. Replace data-ad-client / data-ad-slot
        with real values, then uncomment the script tag in index.html
        <head> to enable. The .ad-slot CSS reserves space so the page
        does not shift when ads load.
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
      -->
      <aside id="ad-slot-home" class="ad-slot" aria-label="advertisement">
        <ins
          class="adsbygoogle"
          style="display:block"
          data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
          data-ad-slot="XXXXXXXXXX"
          data-ad-format="auto"
          data-full-width-responsive="true"
        ></ins>
        <span class="ad-placeholder" data-i18n="adPlaceholder"></span>
      </aside>

      <section class="topics">
        <h2 data-i18n="brandsTitle"></h2>
        <div id="brands" class="chips"></div>
        <h2 data-i18n="topicsTitle"></h2>
        <div id="topics" class="chips"></div>
      </section>

      <section class="image-flags">
        <h2 data-i18n="imageFlagsTitle"></h2>
        <p class="hint" data-i18n="imageFlagsHint"></p>
        <p id="image-flags-empty" class="hint" hidden></p>
        <ul id="image-flags-list" class="flag-list"></ul>
      </section>
    </main>

    <footer>
      <p>
        <span data-i18n="dataSource"></span>
        <a href="https://www.businessmontres.com" rel="noopener">businessmontres.com</a>
      </p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
