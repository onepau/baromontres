<!doctype html>
<html lang="en">
  <head>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2463271452765112"
      crossorigin="anonymous"
    ></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tick ticker — French watch press price barometer</title>
    <meta
      name="description"
      content="Track price trends and editorial sentiment in the French-language watch press. Daily-updated barometer of articles from businessmontres.com."
    />

    <link rel="canonical" href="https://tick-ticker.com/en" />
    <link rel="alternate" hreflang="fr" href="https://tick-ticker.com/" />
    <link rel="alternate" hreflang="en" href="https://tick-ticker.com/en" />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://tick-ticker.com/"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tick ticker" />
    <meta
      property="og:title"
      content="Tick ticker — French watch press price barometer"
    />
    <meta
      property="og:description"
      content="Track price trends and editorial sentiment in the French-language watch press. Daily-updated barometer of articles from businessmontres.com."
    />
    <meta property="og:url" content="https://tick-ticker.com/en" />
    <meta property="og:image" content="https://tick-ticker.com/og.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tick ticker — French watch press price barometer"
    />
    <meta
      name="twitter:description"
      content="Track price trends and editorial sentiment in the French-language watch press. Daily-updated barometer of articles from businessmontres.com."
    />
    <meta name="twitter:image" content="https://tick-ticker.com/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "Tick ticker — French watch press price barometer",
        "description": "Price and editorial-sentiment time series for articles published by the French-language watch press, refreshed daily from businessmontres.com.",
        "url": "https://tick-ticker.com/en",
        "inLanguage": "en",
        "keywords": [
          "watches",
          "watch press",
          "businessmontres.com",
          "prices",
          "sentiment analysis",
          "barometer"
        ],
        "isAccessibleForFree": true,
        "creator": {
          "@type": "Organization",
          "name": "Tick ticker",
          "url": "https://tick-ticker.com"
        },
        "distribution": [
          {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "https://tick-ticker.com/api/barometer"
          }
        ]
      }
    </script>

    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <h1>Tick ticker</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <nav class="lang-switch" aria-label="Language">
        <button data-lang="fr" aria-pressed="false">FR</button>
        <button data-lang="en" aria-pressed="true">EN</button>
      </nav>
    </header>

    <main>
      <section class="intro" aria-label="about">
        <h2 data-i18n="introTitle"></h2>
        <p data-i18n="introBody"></p>
      </section>

      <section class="paywall-meter" aria-label="paywall meter">
        <h2 data-i18n="paywallTitle"></h2>
        <nav class="paywall-periods" aria-label="subscription period">
          <button data-period="weekly" aria-pressed="false">W</button>
          <button data-period="monthly" aria-pressed="true">M</button>
          <button data-period="quarterly" aria-pressed="false">Q</button>
          <button data-period="annual" aria-pressed="false">Y</button>
          <button data-period="annual_supporter" aria-pressed="false">
            S+
          </button>
        </nav>
        <div class="paywall-grid">
          <div class="paywall-stat">
            <strong id="paywall-total">…</strong>
            <span data-i18n="paywallTotalLabel"></span>
          </div>
          <div class="paywall-stat">
            <strong id="paywall-sub">…</strong>
            <span data-i18n="paywallSubLabel"></span>
          </div>
          <div class="paywall-stat paywall-headline">
            <strong id="paywall-multiple">…</strong>
            <span data-i18n="paywallMultipleLabel"></span>
          </div>
        </div>
        <p class="paywall-caption" data-i18n="paywallCaption"></p>
      </section>

      <section class="chart-section">
        <div class="chart-meta">
          <div>
            <span class="meta-label" data-i18n="period"></span>
            <strong id="meta-period">…</strong>
          </div>
          <div>
            <span class="meta-label" data-i18n="averagePrice"></span>
            <strong id="meta-average">…</strong>
          </div>
          <div>
            <span class="meta-label" data-i18n="articleCount"></span>
            <strong id="meta-count">…</strong>
          </div>
          <div>
            <span class="meta-label" data-i18n="subscription"></span>
            <strong id="meta-subscription">—</strong>
          </div>
        </div>
        <nav class="range-filter" aria-label="date range">
          <button data-range="1m" type="button" aria-pressed="false">1M</button>
          <button data-range="3m" type="button" aria-pressed="false">3M</button>
          <button data-range="6m" type="button" aria-pressed="false">6M</button>
          <button data-range="1y" type="button" aria-pressed="false">1Y</button>
          <button
            data-range="all"
            type="button"
            aria-pressed="true"
            data-i18n="rangeAll"
          ></button>
        </nav>
        <div class="chart-wrap">
          <canvas
            id="barometer"
            width="1024"
            height="420"
            aria-label="price barometer"
          ></canvas>
          <button
            id="reset-zoom"
            class="reset-zoom"
            type="button"
            data-i18n="resetZoom"
            hidden
          ></button>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
        <ul class="legend" aria-label="sentiment legend">
          <li>
            <span class="dot dot-positive"></span
            ><span data-i18n="positive"></span>
          </li>
          <li>
            <span class="dot dot-neutral"></span
            ><span data-i18n="neutral"></span>
          </li>
          <li>
            <span class="dot dot-negative"></span
            ><span data-i18n="negative"></span>
          </li>
          <li>
            <span class="dot dot-unknown"></span
            ><span data-i18n="unknown"></span>
          </li>
          <li>
            <span class="dash dash-trend"></span
            ><span data-i18n="trendMonthlyAverage"></span>
          </li>
        </ul>
      </section>

      <!--
        Google AdSense placeholder. Replace data-ad-client / data-ad-slot
        with real values, then uncomment the script tag in index.html
        <head> to enable. The .ad-slot CSS reserves space so the page
        does not shift when ads load.
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
      -->
      <aside id="ad-slot-home" class="ad-slot" aria-label="advertisement">
        <ins
          class="adsbygoogle"
          style="display: block"
          data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
          data-ad-slot="XXXXXXXXXX"
          data-ad-format="auto"
          data-full-width-responsive="true"
        ></ins>
        <span class="ad-placeholder" data-i18n="adPlaceholder"></span>
      </aside>

      <section class="brand-leaderboard" aria-label="brand leaderboard">
        <h2 data-i18n="brandsTitle"></h2>
        <nav class="brand-tabs" aria-label="leaderboard view">
          <button
            data-view="coverage"
            aria-pressed="true"
            data-i18n="brandsTabCoverage"
          ></button>
          <button
            data-view="positive"
            aria-pressed="false"
            data-i18n="brandsTabPositive"
          ></button>
          <button
            data-view="negative"
            aria-pressed="false"
            data-i18n="brandsTabNegative"
          ></button>
        </nav>
        <ol id="brand-list" class="brand-list"></ol>
      </section>

      <section class="topics">
        <h2 data-i18n="topicsTitle"></h2>
        <div id="topics" class="chips"></div>
      </section>

      <section class="image-flags">
        <h2 data-i18n="imageFlagsTitle"></h2>
        <p class="hint" data-i18n="imageFlagsHint"></p>
        <p id="image-flags-empty" class="hint" hidden></p>
        <ul id="image-flags-list" class="flag-list"></ul>
      </section>
    </main>

    <footer>
      <p>
        <span data-i18n="dataSource"></span>
        <a href="https://www.businessmontres.com" rel="noopener"
          >businessmontres.com</a
        >
      </p>
    </footer>

    <script type="module" src="../main.ts"></script>
  </body>
</html>
