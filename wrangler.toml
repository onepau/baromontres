name = "baromontres"
main = "apps/web/src/worker.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
# Route every request through the Worker so the X-Robots-Tag: noindex header in
# worker.ts is applied to the static HTML too, not just /api/*. Without this,
# Static Assets serve matching files directly and bypass the Worker, leaving the
# barometer's pages without the noindex directive on its protected host.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "baromontres"
# Replace with the real D1 database id after `wrangler d1 create baromontres`.
database_id = "40793010-0c4d-4a80-a1af-963a50273fc5"

[observability]
[observability.logs]
enabled = true
invocation_logs = true